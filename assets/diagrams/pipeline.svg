<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc">
  <title id="title">SpeedQ: one conversation, a clear next step</title>
  <desc id="desc">Four Clario intake routes: account and general questions may finish in intake, or request more help. Urgent concerns and requests for a person also go to a customer service card. All escalations pass through review, correction and confirmation before deterministic Prorio scoring and protocol proposals. An officer claims the case and approves, modifies or handles it manually. Recorded outcomes update customer progress and audit history. Officer changes can become suggestions; human approval activates protocol versions used by future proposals. Synthetic data and simulated banking actions; live Retell requires external configuration.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4.5 0 9" fill="none" stroke="#493735" stroke-width="2" stroke-linejoin="round"/></marker>
    <marker id="red-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4.5 0 9" fill="none" stroke="#B5120C" stroke-width="2" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#1F2029}
      .muted{fill:#636363}
      .red{fill:#B5120C}
      .panel{fill:#FCEDEA;stroke:#F6DAD5;stroke-width:1}
      .box{fill:#FFFFFF;stroke:#CFC5C2;stroke-width:1.5}
      .line{fill:none;stroke:#493735;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .feedback{fill:none;stroke:#B5120C;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .label{font-size:26px;font-weight:700}
      .body{font-size:23px}
    </style>
  </defs>
  <rect width="1600" height="1140" fill="#FFFEFC"/>
  <rect x="42" y="50" width="7" height="112" rx="3" fill="#B5120C"/>
  <text x="76" y="106" font-size="64" font-weight="700" letter-spacing="-2">SpeedQ</text>
  <text x="76" y="154" font-size="32" class="muted">One conversation. A clear next step.</text>
  <rect x="1250" y="58" width="310" height="52" rx="26" fill="#FCEDEA" stroke="#E9B9B2"/>
  <text x="1405" y="92" font-size="23" text-anchor="middle" class="red" font-weight="700">Hackathon prototype</text>
  <!-- Reading order: intake, confirmed card, deterministic proposal, human decision. -->
  <rect x="40" y="214" width="520" height="660" rx="20" class="panel"/>
  <rect x="594" y="214" width="448" height="660" rx="20" class="panel"/>
  <rect x="1076" y="214" width="484" height="660" rx="20" class="panel"/>
  <text x="64" y="276" font-size="34" font-weight="700"><tspan class="red">01</tspan><tspan dx="16">Clario intake</tspan></text>
  <text x="618" y="276" font-size="30" font-weight="700"><tspan class="red">02</tspan><tspan dx="13">Confirm + prioritise</tspan></text>
  <text x="1100" y="276" font-size="32" font-weight="700"><tspan class="red">03</tspan><tspan dx="14">Officer decision</tspan></text>
  <path d="M64 303H536 M618 303H1018 M1100 303H1536" stroke="#D6B0AA" stroke-width="1.5"/>
  <text x="64" y="351" class="body muted">Text or voice</text>
  <!-- Account/general answers have two exits: finish, or escalate for more help. -->
  <rect x="64" y="385" width="256" height="80" rx="12" class="box"/>
  <text x="84" y="434" class="label">Account question</text>
  <rect x="64" y="489" width="256" height="80" rx="12" class="box"/>
  <text x="84" y="538" class="label">General question</text>
  <rect x="375" y="408" width="160" height="96" rx="12" fill="#F3F8F5" stroke="#567768" stroke-width="1.5"/>
  <text x="455" y="449" text-anchor="middle" font-size="24" font-weight="700" fill="#3F6252">Answered</text>
  <text x="455" y="480" text-anchor="middle" font-size="23" fill="#3F6252">in intake</text>
  <path d="M320 425H344V456 M320 529H344V456H368" class="line" marker-end="url(#arrow)"/>
  <path d="M344 529V588H576V458H612" class="line" marker-end="url(#arrow)"/>
  <rect x="386" y="565" width="145" height="34" rx="8" fill="#FCEDEA"/>
  <text x="458" y="590" text-anchor="middle" font-size="22" class="muted">More help</text>
  <rect x="64" y="660" width="256" height="80" rx="12" class="box"/>
  <text x="84" y="709" class="label">Urgent concern</text>
  <rect x="64" y="764" width="256" height="80" rx="12" class="box"/>
  <text x="84" y="813" class="label">Talk to a person</text>
  <!-- These routes merge BEFORE the card; they never bypass confirmation. -->
  <path d="M320 700H360V638H576V588 M320 804H360V638" class="line"/>
  <circle cx="344" cy="529" r="4" fill="#493735"/>
  <circle cx="576" cy="588" r="4" fill="#493735"/>
  <text x="64" y="626" font-size="20" class="muted">Live Retell needs configuration.</text>
  <!-- No unconfirmed draft reaches the operational ranker. -->
  <rect x="620" y="378" width="396" height="160" rx="14" class="box"/>
  <text x="818" y="429" text-anchor="middle" class="label">Customer Service Card</text>
  <text x="818" y="473" text-anchor="middle" class="body">Review · correct · confirm</text>
  <text x="818" y="510" text-anchor="middle" font-size="20" class="muted">Unconfirmed drafts stay out of queue.</text>
  <path d="M818 538V590" class="line" marker-end="url(#arrow)"/>
  <rect x="620" y="600" width="396" height="234" rx="14" fill="#FFF9F8" stroke="#B5120C" stroke-width="2.5"/>
  <text x="818" y="649" text-anchor="middle" font-size="37" font-weight="700" class="red">Prorio</text>
  <text x="818" y="691" text-anchor="middle" class="body">Deterministic rules</text>
  <text x="818" y="724" text-anchor="middle" class="body">+ owned account evidence</text>
  <path d="M648 747H988" stroke="#E9B9B2" stroke-width="1.5"/>
  <text x="818" y="785" text-anchor="middle" font-size="25" font-weight="700">Ranked case +</text>
  <text x="818" y="817" text-anchor="middle" font-size="25" font-weight="700">protocol proposal</text>
  <!-- Ranking always leads to explicit officer pickup and a decision. -->
  <path d="M1016 716H1058V458H1094" class="line" marker-end="url(#arrow)"/>
  <rect x="1102" y="378" width="432" height="200" rx="14" class="box"/>
  <text x="1318" y="431" text-anchor="middle" font-size="31" font-weight="700">Claim and review</text>
  <text x="1318" y="474" text-anchor="middle" class="body muted">One owner · revision checks</text>
  <rect x="1118" y="508" width="124" height="46" rx="8" fill="#FFFFFF" stroke="#CFC5C2"/>
  <rect x="1256" y="508" width="124" height="46" rx="8" fill="#FFFFFF" stroke="#CFC5C2"/>
  <rect x="1394" y="508" width="124" height="46" rx="8" fill="#FFFFFF" stroke="#CFC5C2"/>
  <text x="1180" y="539" text-anchor="middle" font-size="23">Approve</text>
  <text x="1318" y="539" text-anchor="middle" font-size="23">Modify</text>
  <text x="1456" y="539" text-anchor="middle" font-size="23">Manual</text>
  <path d="M1318 578V680" class="line" marker-end="url(#arrow)"/>
  <text x="1340" y="632" font-size="21" class="muted">Record the outcome</text>
  <rect x="1102" y="690" width="432" height="118" rx="14" fill="#F3F8F5" stroke="#567768" stroke-width="1.5"/>
  <text x="1318" y="738" text-anchor="middle" font-size="26" font-weight="700">Customer progress + audit</text>
  <text x="1318" y="778" text-anchor="middle" font-size="21" class="muted">Simulated actions · recorded result</text>
  <!-- Suggestions do not become active rules until a human approves a version. -->
  <rect x="40" y="950" width="1520" height="110" rx="18" fill="#FFF6F4" stroke="#E9B9B2" stroke-width="1.5"/>
  <path d="M1534 562H1546V940" class="feedback" marker-end="url(#red-arrow)"/>
  <text x="800" y="989" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="2" class="red">HUMAN-REVIEWED FEEDBACK</text>
  <text x="800" y="1030" text-anchor="middle" font-size="27">Officer changes → suggestions → human approval → future protocol versions</text>
  <path d="M40 1005H20V905H818V842" class="feedback" marker-end="url(#red-arrow)"/>
  <text x="800" y="1110" text-anchor="middle" font-size="23" class="muted">Synthetic data · Simulated banking actions · Live configuration or local scripted demo</text>
</svg>
